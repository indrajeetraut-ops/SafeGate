<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SafeGate - Manage Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body data-theme="dark">
    <div id="toast-container" class="toast-container"></div>
    <div id="app">
        <!-- Admin Dashboard View -->
        <section id="admin-view" class="screen active">
            <header class="app-header glass-header">
                <button class="icon-btn" onclick="app.logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                <h2>Admin Dashboard</h2>
                <div class="header-actions">
                    <button class="icon-btn" onclick="app.openThemeSettings()"><i class="fa-solid fa-palette"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-calendar-day"></i></button>
                </div>
            </header>
            <div class="admin-layout">
                <aside class="admin-sidebar">
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('dashboard')" id="nav-page-dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('students')" id="nav-page-students"><i class="fa-solid fa-users"></i> Students</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('gatekeepers')" id="nav-page-gatekeepers"><i class="fa-solid fa-user-shield"></i> Gatekeepers</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('parents')" id="nav-page-parents"><i class="fa-solid fa-user-group"></i> Parents</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('id-cards')" id="nav-page-id-cards"><i class="fa-solid fa-address-card"></i> ID Cards</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('attendance')" id="nav-page-attendance"><i class="fa-solid fa-clipboard-user"></i> Attendance</div>
                    <div class="sidebar-nav-item active" onclick="app.navigateToAdminPage('notifications')" id="nav-page-notifications"><i class="fa-solid fa-bell"></i> Notifications</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('classes')" id="nav-page-classes"><i class="fa-solid fa-chalkboard"></i> Classes</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('settings')" id="nav-page-settings"><i class="fa-solid fa-gear"></i> Settings</div>
                </aside>
                
                <main class="admin-main-content">
                    <div id="page-notifications" class="admin-page active">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                            <h3 style="color: var(--text-muted);">Manage Notifications</h3>
                        </div>

                        <div class="admin-toolbar glass-panel" style="margin-bottom: 1.5rem; border-radius: var(--radius-md); padding: 0.5rem; display: flex; gap: 0.5rem;">
                            <button class="btn btn-primary btn-sm flex-fill" id="btn-tab-create-notification" onclick="app.switchNotificationTab('create')"><i class="fa-solid fa-pen-to-square"></i> Create New</button>
                            <button class="btn btn-tertiary btn-sm flex-fill" id="btn-tab-drafts" onclick="app.switchNotificationTab('drafts')"><i class="fa-solid fa-file-lines"></i> Drafts</button>
                            <button class="btn btn-tertiary btn-sm flex-fill" id="btn-tab-sent" onclick="app.switchNotificationTab('sent')"><i class="fa-solid fa-paper-plane"></i> Sent History</button>
                        </div>

                        <!-- Create New Tab -->
                        <div id="tab-create-notification" class="notification-tab-content">
                            <form id="notification-form" onsubmit="event.preventDefault();" class="glass-panel">
                                <input type="hidden" id="notif-doc-id">
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                                    <div>
                                        <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.3rem;">Notification Type</label>
                                        <select id="notif-type" class="custom-select w-100" onchange="app.handleNotificationTypeChange()">
                                            <option value="Event">Event</option>
                                            <option value="Meeting">Meeting</option>
                                            <option value="Holiday">Holiday</option>
                                            <option value="Emergency">Emergency</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div id="notif-custom-type-container" style="display: none;">
                                        <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.3rem;">Custom Type Name</label>
                                        <input type="text" id="notif-custom-type" class="custom-input w-100" placeholder="e.g. Weather Alert">
                                    </div>
                                </div>

                                <div style="margin-bottom: 1.5rem;">
                                    <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.5rem;">Target Audience</label>
                                    <div style="display: flex; gap: 1.5rem; align-items: center;">
                                        <label style="cursor: pointer;"><input type="radio" name="notif-target-type" value="individual" onclick="app.handleNotificationTargetChange()"> Individual Student</label>
                                        <label style="cursor: pointer;"><input type="radio" name="notif-target-type" value="class" checked onclick="app.handleNotificationTargetChange()"> Full Class</label>
                                        <label style="cursor: pointer;"><input type="radio" name="notif-target-type" value="multiple" onclick="app.handleNotificationTargetChange()"> Select Few Students</label>
                                    </div>
                                </div>

                                <div id="notif-target-selection-container" class="glass-panel" style="background: rgba(0,0,0,0.1); margin-bottom: 1.5rem;">
                                    <!-- Dynamic selection UI rendered by JS -->
                                </div>

                                <div style="margin-bottom: 1rem;">
                                    <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.3rem;">Notification Title</label>
                                    <input type="text" id="notif-title" class="custom-input w-100" placeholder="Enter title..." required>
                                </div>

                                <div style="margin-bottom: 1.5rem;">
                                    <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.3rem;">Message</label>
                                    <textarea id="notif-message" class="custom-input w-100" rows="5" placeholder="Type the message for the parents here..." required></textarea>
                                </div>

                                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                                    <button type="button" class="btn btn-secondary" onclick="app.saveNotificationDraft()"><i class="fa-solid fa-file-arrow-down"></i> Save as Draft</button>
                                    <button type="button" class="btn btn-primary" onclick="app.sendNotification()"><i class="fa-solid fa-paper-plane"></i> Send Notification</button>
                                </div>
                            </form>
                        </div>

                        <!-- Drafts Tab -->
                        <div id="tab-drafts" class="notification-tab-content" style="display: none;">
                            <div class="glass-panel">
                                <div class="table-container">
                                    <table class="data-table">
                                        <thead>
                                            <tr>
                                                <th>Title</th>
                                                <th>Type</th>
                                                <th>Target</th>
                                                <th>Last Modified</th>
                                                <th style="text-align: right;">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="notif-drafts-table-body">
                                            <!-- Populated by JS -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Sent History Tab -->
                        <div id="tab-sent" class="notification-tab-content" style="display: none;">
                            <div class="glass-panel">
                                <div class="table-container">
                                    <table class="data-table">
                                        <thead>
                                            <tr>
                                                <th>Title</th>
                                                <th>Type</th>
                                                <th>Target</th>
                                                <th>Sent Time</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="notif-sent-table-body">
                                            <!-- Populated by JS -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </main>
            </div>
        </section>

        <!-- Theme Settings Modal (for Header palette icon) -->
        <div id="theme-modal" class="modal">
            <div class="modal-content glass-panel bounce-in" style="max-width: 400px; padding: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                    <h2>Theme Preferences</h2>
                    <button class="icon-btn" onclick="app.closeThemeSettings()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div style="margin-bottom: 1.5rem;">
                    <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.5rem;">Display Mode</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-tertiary w-100" id="btn-theme-dark" onclick="app.setBaseTheme('dark')"><i class="fa-solid fa-moon"></i> Dark</button>
                        <button class="btn btn-tertiary w-100" id="btn-theme-light" onclick="app.setBaseTheme('light')"><i class="fa-solid fa-sun"></i> Light</button>
                    </div>
                </div>

                <div id="brand-theme-section" style="display: none; margin-bottom: 1.5rem; text-align: left;">
                    <label class="text-muted" style="font-size:0.85rem;">School Brand Color (Primary)</label>
                    <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
                        <input type="color" id="school-brand-color" class="custom-input" style="height: 48px; width: 64px; padding: 0.2rem;">
                        <button class="btn btn-primary w-100" onclick="app.saveBrandColor()">Set Brand</button>
                    </div>
                </div>
            </div>
        </div>
    </div> <!-- Close #app -->

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

    <script src="app.js?v=2.2"></script>
</body>
</html>
