<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SafeGate - Manage Parents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body data-theme="dark">
    <div id="toast-container" class="toast-container"></div>
    <div id="app">
        <!-- Admin View -->
        <section id="admin-view" class="screen active">
            <header class="app-header glass-header">
                <button class="icon-btn" onclick="app.logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                <h2>Admin Dashboard</h2>
                <div class="header-actions">
                    <button class="icon-btn" onclick="app.openThemeSettings()"><i class="fa-solid fa-palette"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-calendar-day"></i></button>
                </div>
            </header>
            <div class="admin-layout">
                <aside class="admin-sidebar">
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('dashboard')" id="nav-page-dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('students')" id="nav-page-students"><i class="fa-solid fa-users"></i> Students</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('gatekeepers')" id="nav-page-gatekeepers"><i class="fa-solid fa-user-shield"></i> Gatekeepers</div>
                    <div class="sidebar-nav-item active" onclick="app.navigateToAdminPage('parents')" id="nav-page-parents"><i class="fa-solid fa-user-group"></i> Parents</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('id-cards')" id="nav-page-id-cards"><i class="fa-solid fa-address-card"></i> ID Cards</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('attendance')" id="nav-page-attendance"><i class="fa-solid fa-clipboard-user"></i> Attendance</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('notifications')" id="nav-page-notifications"><i class="fa-solid fa-bell"></i> Notifications</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('classes')" id="nav-page-classes"><i class="fa-solid fa-chalkboard"></i> Classes</div>
                    <div class="sidebar-nav-item" onclick="app.navigateToAdminPage('settings')" id="nav-page-settings"><i class="fa-solid fa-gear"></i> Settings</div>
                </aside>
                
                <main class="admin-main-content">
                    <div id="page-parents" class="admin-page active">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                            <h3 style="color: var(--text-muted);">Manage Parents</h3>
                            <button class="btn btn-primary btn-sm" onclick="app.openManageParentModal()"><i class="fa-solid fa-plus"></i> Add Parent</button>
                        </div>
                        <div class="glass-panel">
                            <div class="admin-toolbar">
                                <div class="admin-filters">
                                    <input type="text" id="parent-search" class="custom-input" placeholder="Search parent phone..."
                                        oninput="app.renderParents()">
                                </div>
                            </div>
                            <div class="table-container mt-4">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Parent Phone</th>
                                            <th>Linked Students</th>
                                            <th style="text-align: right;">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="parents-table-body">
                                        <!-- Populated by JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </section>

        <!-- Manage Parent CRUD Modal -->
        <div id="manage-parent-modal" class="modal">
            <div class="modal-content glass-panel bounce-in" style="max-width: 450px; padding: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                    <h2 id="parent-modal-title">Map Parent to Students</h2>
                    <button class="icon-btn" type="button" onclick="app.closeManageParentModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <form id="parent-form" onsubmit="app.saveParent(event)">
                    <input type="hidden" id="parent-doc-id" value="">
                    
                    <div style="margin-bottom: 1.2rem;">
                        <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.3rem;">Parent Phone Number</label>
                        <input type="tel" id="parent-phone" class="custom-input w-100" placeholder="+1..." required>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label class="text-muted" style="font-size:0.85rem; display:block; margin-bottom: 0.3rem;">Select Linked Students</label>
                        <div class="glass-panel" id="parent-student-checkboxes" style="max-height: 150px; overflow-y: auto; padding: 1rem;">
                            <!-- JS populated Checkboxes -->
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button type="button" class="btn btn-tertiary w-100" onclick="app.closeManageParentModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-floppy-disk"></i> Save Mapping</button>
                    </div>
                </form>
            </div>
        </div>
    </div> <!-- Close #app -->

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1WDzcL4c0e4g-wPHhCLKsehp8tjqKot4",
            authDomain: "safegate-af378.firebaseapp.com",
            projectId: "safegate-af378",
            storageBucket: "safegate-af378.firebasestorage.app",
            messagingSenderId: "164296559017",
            appId: "1:164296559017:web:5c2aea0a001485404d1cb8",
            measurementId: "G-2D89KKFCSR"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.firestore();
    </script>
    <script src="app.js?v=2.2"></script>
</body>
</html>
